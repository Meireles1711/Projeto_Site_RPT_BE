<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Menu Usuários</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #139701, #3cff00);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      display: block;
      width: 250px;
      padding: 15px;
      margin: 10px auto;
      border: none;
      border-radius: 8px;
      background: #1a9701;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0fb300;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📡Confer Sistem</h1>

    <button onclick="abrir('index.html')">📊 Conferir Usuários</button>
    <button onclick="abrir('crud.html')">🛠️ Criar Usuário</button>
  </div>

  <script>
    function abrir(pagina) {
      window.location.href = pagina;
    }
  </script>

</body>

</html>
